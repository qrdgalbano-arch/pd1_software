<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rehab Station - Design C Prototype</title><link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"../PD1_Software_Design_C/web/vendor/three/build/three.module.js"}}</script></head>
<body>
<header><b>QMMC Rehab Station</b><span id="who"></span></header>

<section id="login" class="screen"><h2>Enter Patient ID</h2>
<input id="pid" inputmode="numeric" maxlength="7" placeholder="7-digit ID"><button id="pidGo">Continue</button><p id="pidErr" class="err"></p></section>

<section id="list" class="screen hidden"><div class="card"><h3>EXERCISES TODAY</h3><div id="today"></div></div><div id="exList"></div>
<button id="finishAll" class="secondary">View session summary</button></section>

<section id="detail" class="screen hidden"><h2 id="dName"></h2>
<div class="row"><div class="chip"><small>PRESCRIPTION</small><b id="dRx"></b></div><div class="chip"><small>FREQUENCY</small><b id="dFreq"></b></div></div>
<div class="card"><b>Instructions</b><ol id="dIns"></ol><p id="dCam"></p></div>
<div class="video">[Video Demo]</div><button id="startSession">Start Session</button> <button id="backList" class="secondary">Back</button></section>

<section id="record" class="screen hidden">
<div class="bar"><span id="rTitle"></span><span id="rInfo"></span></div>
<div class="grid"><div class="cam"><video id="vid" playsinline muted></video><canvas id="ov"></canvas></div>
<div><div class="twin"><canvas id="twin3d" width="420" height="300"></canvas><canvas id="twin" width="420" height="300"></canvas></div><small>Digital twin: solid = you, faded blue = target</small></div></div>
<div id="msg" class="msg">Starting camera...</div>
<div id="stat" class="stat"></div>
<div id="rest" class="hidden card"><h3>Rest</h3><div id="restClock" class="clock"></div><button id="extend">Extend rest (+1 min)</button></div>
<button id="stopRec" class="secondary">Stop session</button></section>

<section id="summary" class="screen hidden"><h2>Session Summary</h2><div id="sumBody"></div>
<button id="dl" class="secondary">Download JSON</button> <button id="toList">Back to exercises</button></section>

<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
<script type="module" src="app.js"></script></body></html>
